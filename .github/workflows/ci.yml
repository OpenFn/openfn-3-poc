name: CI

on:
  pull_request:
    branches: [main]
    # Skip when only docs change. Later lines win: annotations/ is bundled into
    # the app (the annotations panel), so it still runs CI.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!.claude/**"
      - "annotations/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run build-storybook
