name: CI

on:
  pull_request:
    branches: [main]

# main requires lint, test and storybook, so CI runs on every PR. A PR that only
# changes docs skips the three jobs (a skipped job counts as passed), so it
# merges after a few seconds. annotations/ is bundled into the app, so it counts as code.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          code=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -vE "(\.md$|^docs/|^\.claude/)" | head -1)
          annotations=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep "^annotations/" | head -1)
          if [ -n "$code$annotations" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  # Then three jobs side by side, so CI takes as long as the slowest one.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The design-system numbers and debt: lines only go down (scripts/design-system-baseline.json).
      - run: node scripts/design-system-metrics.mjs --check

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  storybook:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
