name: kickstart-me
description: null
collections: null
channels: null
credentials:
  demo@openfn.org-bsj-credential:
    name: bsj credential
    owner: demo@openfn.org
workflows:
  catfact-demo:
    name: catfact demo
    jobs:
      get-catfact:
        name: get catfact
        adaptor: '@openfn/language-http@7.0.4'
        credential: null
        body: |
          get('https://catfact.ninja/fact');
          
          fn(state => {
            console.log("this is what we got from the first API:", state.data)
          
            const transformation = state.data.fact.substring(3);
            console.log(transformation);
          
            return {...state, transformation, fact: state.data.fact}
          });
      send-to-sheets:
        name: send to sheets
        adaptor: '@openfn/language-googlesheets@latest'
        credential: null
        body: |
          // Load to https://docs.google.com/spreadsheets/d/1oCwO_lqDuVWzXLWMsj3R0g2SL1iwRapE7IeOqjYhAu8
          appendValues({
            // Add your Sheet ID here...good
            spreadsheetId: '1oCwO_lqDuVWzXLWMsj3R0g2SL1iwRapE7IeOqjYhAu8',
            range: 'Sheet1!A1:E1',
            values: [
              [
                $.fact, $.data.content[0].text,
                new Date().toISOString()
              ],
            ],
          })
      ask-claude-for-a-poem-about-it:
        name: ask claude for a poem about it
        adaptor: '@openfn/language-claude@1.0.7'
        credential: null
        body: |
          prompt('Write me a poem about: ' + $.transformation);
      send-it-to-me:
        name: send it to me
        adaptor: '@openfn/language-gmail@1.3.0'
        credential: null
        body: |
          // Check out the Job Writing Guide for help getting started:
          // https://docs.openfn.org/documentation/jobs/job-writing-guide
          
          sendMessage({
            to: 'demo@openfn.org',
            subject: 'You like poems about cats',
            body: $.data.content[0].text,
            attachments: [ ]
          })
    triggers:
      cron:
        type: cron
        cron_expression: '0 0 * * *'
        enabled: false
    edges:
      cron->get-catfact:
        source_trigger: cron
        target_job: get-catfact
        condition_type: always
        enabled: true
      ask-claude-for-a-poem-about-it->send-to-sheets:
        source_job: ask-claude-for-a-poem-about-it
        target_job: send-to-sheets
        condition_type: on_job_success
        enabled: true
      get-catfact->ask-claude-for-a-poem-about-it:
        source_job: get-catfact
        target_job: ask-claude-for-a-poem-about-it
        condition_type: on_job_success
        enabled: true
      ask-claude-for-a-poem-about-it->send-it-to-me:
        source_job: ask-claude-for-a-poem-about-it
        target_job: send-it-to-me
        condition_type: on_job_success
        enabled: true